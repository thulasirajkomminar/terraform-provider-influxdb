# A bot ensures that these actions get synchronized - do not edit in this repository.

name: PR

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - docs/**
      - examples/**
      - .github/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          install-only: true

      - name: Run GoReleaser
        run: goreleaser build --clean --skip=validate --snapshot
